{{/*
FIGURE
------
Picture element in a figure.
*/}}

<figure class="a-figure {{ $.classes }}">
  {{ $src := .src }}
  {{ if not (hasPrefix $src "/") }}
    {{ $src = print "/" $src }}
  {{ end }}
  
  {{ $image := resources.GetMatch (strings.TrimPrefix "/" $src) }}
  {{ if $image }}
    {{ $tiny := $image.Resize "20x" }}
    {{ $small := $image.Resize "320x" }}
    {{ $medium := $image.Resize "720x" }}
    {{ $large := $image.Resize "1440x" }}
    {{ $xlarge := $image.Resize "2160x" }}

    <picture class="a-picture">
      <!-- Use data-srcset for LazyLoad library compatibility -->
      <source data-srcset="{{ $xlarge.RelPermalink }}" media="(min-width: 1200px)">
      <source data-srcset="{{ $large.RelPermalink }}" media="(min-width: 700px)">
      <source data-srcset="{{ $medium.RelPermalink }}" media="(min-width: 300px)">
      <!-- Use tiny thumbnail for better loading experience -->
      <img
        src="{{ $tiny.RelPermalink }}"
        data-src="{{ $small.RelPermalink }}"
        alt="{{ $.alt }}"
        {{ if $.width }}width="{{ $.width }}"{{ else }}width="{{ $image.Width }}"{{ end }}
        {{ if $.height }}height="{{ $.height }}"{{ else }}height="{{ $image.Height }}"{{ end }}
        loading="lazy">
    </picture>

    {{ if $.caption }}
      <figcaption>
       {{ $.caption }}
      </figcaption>
    {{ end }}
  {{ else }}
    <!-- Fallback when image not found: {{ .src }} -->
    <div class="a-picture a-picture--missing">Image not available</div>
  {{ end }}
</figure>
